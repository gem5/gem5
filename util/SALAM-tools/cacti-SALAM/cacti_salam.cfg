# tools/cacti-SALAM/cacti_template.cfg
# Base configuration for CACTI runs.
# The Python script will replace size and ports dynamically.

# --- Parameters to be replaced by script ---
-size (bytes) 8192
-read-write port 1

# --- Default Fixed Parameters ---
-block size (bytes) 64
-associativity 1
-exclusive read port 0
-exclusive write port 0
-single ended read ports 0
-UCA bank count 1
-technology (u) 0.045
-page size (bits) 0
-burst length 8
-internal prefetch width 8
-Data array cell type - "itrs-hp"
-Data array peripheral type - "itrs-hp"
-Tag array cell type - "itrs-hp"
-Tag array peripheral type - "itrs-hp"
-output/input bus width 512
-operating temperature (K) 300
-cache type "ram"                       # Specify "ram" for SPM
-tag size (b) "default"                 # Use default tag size for RAM
-access mode (normal, sequential, fast) "fast" # Use "normal" (mode 0)
-design objective (weight delay, dynamic power, leakage power, cycle time, area) 0:0:100:0:0
-deviate (delay, dynamic power, leakage power, cycle time, area) 20:100000:100000:1000000:1000000
-Optimize ED or ED^2 (ED, ED^2, NONE) "NONE"
-Cache model (NUCA, UCA) "UCA"
-NUCA bank count 0
-Wire signalling (fullswing, lowswing, default) "lowswing"
-Wire inside mat "semi-global"
-Wire outside mat "semi-global"
-Interconnect projection "aggressive"
-Repeater in Htree? (0-no, 1-yes) 1      # Added from defaults dict
-Core count 1
-Cache level (L2/L3) "L1"
-Add ECC "false"
-Print level (DETAILED, CONCISE) "DETAILED"
-Print input parameters "false"
-Force cache config "false"
-Ndwl 1
-Ndbl 1
-Nspd 0.0                                # Use float here
-Ndcm 1
-Ndsam1 0
-Ndsam2 0

# --- End of Template ---
