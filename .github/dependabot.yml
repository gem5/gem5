---
version: 2
updates:
    - package-ecosystem: pip
      directory: /
      target-branch: develop
      exclude-paths:
          - ext/**
      schedule:
          interval: monthly
      commit-message:
          prefix: 'misc: '
      labels:
          - misc
          - dependencies

    - package-ecosystem: pip
      directories:
          - /util/gem5-resources-manager
          - /util/helper_scripts_for_mongodb
      target-branch: develop
      schedule:
          interval: monthly
      commit-message:
          prefix: 'util: '
      labels:
          - util
          - dependencies

    - package-ecosystem: github-actions
      directory: /
      target-branch: develop
      # These workflows are generated by gh-aw.
      exclude-paths:
          - .github/workflows/*.lock.yml
          - .github/workflows/agentics-maintenance.yml
      schedule:
          interval: monthly
      commit-message:
          prefix: 'misc: '
      labels:
          - misc
          - dependencies
