---
name: Recover Coverage Reports
on:
    workflow_dispatch:
        inputs:
            source-run-id:
                description: Original Code Coverage run whose reports to regenerate
                type: string
                required: true
permissions:
    contents: read
    actions: read
concurrency:
    group: coverage-recovery-${{ inputs.source-run-id }}
    cancel-in-progress: false
    queue: max
jobs:
    report:
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: ./.github/workflows/coverage-report.yaml
        with:
            source-run-id: ${{ inputs.source-run-id }}
        secrets:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
