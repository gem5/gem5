---
# This workflow runs after a pull-request has been approved by a reviewer.

name: CI Tests

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
    cancel-in-progress: true

jobs:
    coverage-tools:
        # These small native fixtures also run on drafts; no gem5 build is needed.
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.10'
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  package-manager-cache: false
            - name: Install coverage test dependencies
              run: python3 -m pip install gcovr==8.3 PyYAML==6.0.2 coverage==7.10.7
            - name: Require the native coverage tools
              run: |
                  gcc --version | head -1
                  gcov --version | head -1
                  python3 -c 'import subprocess; assert "Free Software Foundation" in subprocess.check_output(["gcc", "--version"], text=True)'
            - name: Check collection and reporting
              run: |
                  python3 -m unittest discover -s ext/testlib/tests -p 'test_coverage.py' -v
                  python3 -m unittest discover -s util/coverage -p 'test_*.py' -v
                  python3 -m unittest discover -s util/coverage/tests -p 'test_*.py' -v
                  node --test util/coverage/tests/*.test.cjs

    pre-commit:
    # runs on github hosted runner
        runs-on: ubuntu-24.04
        if: github.event.pull_request.draft == false
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.10'
            - uses: pre-commit/action@v3.0.1
              env:
                  # Formatting runs in the separate clang-format-check job
                  # so its failures remain advisory.
                  SKIP: gem5-git-clang-format

    # Runs on the github hosted runner
    # Checks changed lines against the PR merge base with the same pinned
    # clang-format version used by the local pre-commit hook.
    clang-format-check:
        runs-on: ubuntu-24.04
        if: github.event.pull_request.draft == false
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0  # Need full history to get the merge base

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.10'

            - name: Get merge base commit
              id: get-base-commit
              run: |
                  # Calculate the merge base between the target branch and the PR branch
                  BASE_SHA="${{ github.event.pull_request.base.sha }}"
                  HEAD_SHA="${{ github.event.pull_request.head.sha }}"
                  MERGE_BASE=$(git merge-base $BASE_SHA $HEAD_SHA)

                  echo "base_commit=$MERGE_BASE" >> $GITHUB_OUTPUT

            - name: Run clang-format check
              uses: pre-commit/action@v3.0.1
              with:
                  extra_args: gem5-git-clang-format --all-files
              env:
                  GEM5_CI_PR_BASE_COMMIT: ${{ steps.get-base-commit.outputs.base_commit }}

    get-date:
    # We use the date to label caches. A cache is a a "hit" if the date is the
    # request binary and date are the same as what is stored in the cache.
    # This essentially means the first job to run on a given day for a given
    # binary will always be a "miss" and will have to build the binary then
    # upload it as that day's binary to upload. While this isn't the most
    # efficient way to do this, the alternative was to run take a hash of the
    # `src` directory contents and use it as a hash. We found there to be bugs
    # with the hash function where this task would timeout. This approach is
    # simple, works, and still provides some level of caching.
        runs-on: ubuntu-24.04
        outputs:
            date: ${{ steps.date.outputs.date }}
        steps:
            - name: Get the current date
              id: date
              run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    quick-tests:
        if: github.event.pull_request.draft == false
        needs: [pre-commit]
        uses: ./.github/workflows/quick-tests.yaml

    clang-fast-compilation:
        # gem5 binaries built in `quick-gem5-builds` always use GCC.
        # Clang is more strict than GCC. This job checks that gem5 compiles
        # with Clang. It compiles build/ALL/gem5.fast to maximize the change
        # for compilation error to be exposed.
        runs-on: [self-hosted, linux, x64]
        if: github.event.pull_request.draft == false
        container: ghcr.io/gem5/clang-version-22:latest
        needs: [pre-commit]
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v7
            - name: Clang Compilation
              working-directory: ${{ github.workspace }}
              run: scons build/ALL/gem5.fast -j $(nproc)

    macos-compilation:
        runs-on: macos-26
        if: github.event.pull_request.draft == false
        needs: [pre-commit, get-date]

        strategy:
            fail-fast: false
            matrix:
                type: [fast, opt]

        steps:
            - name: Checkout the gem5 repository
              uses: actions/checkout@v7

            - name: Install the gem5 dependencies
              run: |
                  brew update
                  brew install \
                    scons \
                    python \
                    pkg-config \
                    protobuf \
                    grpc \
                    boost


            - name: Restore macOS build/ALL cache
              uses: actions/cache/restore@v6
              with:
                  path: build/ALL
                  key: macos-all-gem5-${{ matrix.type }}-${{ needs.get-date.outputs.date }}
                  restore-keys: |
                      macos-all-gem5-${{ matrix.type }}

            - name: Compile gem5.${{ matrix.type }}
              working-directory: ${{ github.workspace }}
              run: scons build/ALL/gem5.${{ matrix.type }} -j $(sysctl -n hw.ncpu)
              timeout-minutes: 90

    ci-tests:
    # Preserve the required aggregate check while the quick jobs are reused.
        runs-on: ubuntu-24.04
        needs:
            - coverage-tools
            - quick-tests
            - clang-fast-compilation
            - macos-compilation
            - pre-commit
        steps:
            - run: echo "This job's status is ${{ job.status }}."
