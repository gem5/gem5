---
name: Workflow Scheduler

# GitHub scheduled workflows run on the default branch ('stable' in the case of
# gem5). this means for changes in a workflow to take effect, the default
# branch must be updated. This is not ideal as it requires regular commits into
# the stable branch. Ideally we just want to update the workflow on develop and
# have it run on the develop branch.
#
# This workflow is designed to run on the stable branch and will trigger other
# workflows on the develop branch.
#
# Each cron expression identifies the workflow or workflows to dispatch. This
# avoids using the runner's clock, since GitHub may delay scheduled runs and
# cause two hourly invocations to observe the same hour.

on:
    schedule:
        # Daily tests at 7:30pm UTC, except Friday.
        - cron: 30 19 * * 0-4,6
        # Daily and Weekly tests at 7:30pm UTC on Friday.
        - cron: 30 19 * * 5
        # Compiler tests at 9:30pm UTC on Tuesday.
        - cron: 30 21 * * 2
        # Weekly repository status at 4:30pm UTC on Tuesday.
        - cron: 30 16 * * 2
        # Agentics maintenance at 4:30pm UTC on Friday.
        - cron: 30 16 * * 5
        # Test Failure Doctor every two hours.
        - cron: 0 */2 * * *

env:
  # This is the token used to authenticate with GitHub.
  # It is required to run the `gh` CLI.
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    schedule-workflows:
        runs-on: ubuntu-24.04
        steps:
            # This step is necessary to allow the `gh` CLI to be used in the
            # following steps. The `gh` CLI is used to trigger the workflows.
            # and needs to be used inside a the same repository where the
            # workflows are defined.
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Daily Tests
              if: >-
                  github.event.schedule == '30 19 * * 0-4,6' ||
                  github.event.schedule == '30 19 * * 5'
              run: |
                  gh workflow run daily-tests.yaml --ref develop >/dev/null
                  echo "Daily test scheduled to run on develop branch."

            - name: Weekly Tests and CI-Daily Tests for Codecov
              if: github.event.schedule == '30 19 * * 5'
              run: |
                  gh workflow run weekly-tests.yaml --ref develop >/dev/null
                  gh workflow run ci-daily-codecov.yaml --ref develop >/dev/null
                  echo "Weekly test and runs of CI and Daily tests for code" \
                  "coverage scheduled to run on develop branch."

            - name: Compiler Tests
              if: github.event.schedule == '30 21 * * 2'
              run: |
                  gh workflow run compiler-tests.yaml --ref develop >/dev/null
                  echo "Compiler tests scheduled to run on the develop branch."


            - name: Weekly Repo Status
              if: github.event.schedule == '30 16 * * 2'
              run: |
                  gh workflow run weekly-repo-status.lock.yml \
                      --ref develop >/dev/null
                  echo "Weekly repository status scheduled on develop."

            - name: Test Failure Doctor
              if: github.event.schedule == '0 */2 * * *'
              run: |
                  # Runs that completed within the past three hours.
                  since=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
                  created_after=$(date -u -d '7 days ago' +%Y-%m-%d)
                  runs=$(
                      for workflow in ci-tests daily-tests weekly-tests \
                                      compiler-tests; do
                          gh api --paginate \
                              "repos/${{ github.repository }}/actions/workflows/${workflow}.yaml/runs?status=completed&created=>=${created_after}&per_page=100" \
                              --jq ".workflow_runs[]
                                    | select(.updated_at > \"${since}\")
                                    | [.id, .run_attempt] | @tsv"
                      done | sort -t "$(printf '\t')" -k1,1n
                  )
                  if [ -z "${runs}" ]; then
                      echo "No completed test workflows since ${since}."
                      exit 0
                  else
                      echo ${runs}
                  fi
                  run_ids=$(printf '%s\n' "${runs}" | cut -f1 | paste -sd, -)
                  run_attempts=$(printf '%s\n' "${runs}" | cut -f2 | paste -sd, -)

                  # Run the test-failure-doctor workflow
                  gh aw run test-failure-doctor --ref develop \
                      --raw-field failed_workflow_ids="${run_ids}" \
                      --raw-field failed_workflow_attempts="${run_attempts}" \
                      >/dev/null
                  echo "Test Failure Doctor scheduled on develop for" \
                  "runs: ${run_ids} (attempts: ${run_attempts})"

            - name: Agentics Maintenance
              if: github.event.schedule == '30 16 * * 5'
              run: |
                  gh workflow run agentics-maintenance.yml \
                      --ref develop >/dev/null
                  echo "Agentics maintenance scheduled on develop."
