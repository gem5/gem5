---
# This workflow runs all of the long tests within main.py, extra tests in nightly.sh, and unittests

name: Daily Tests

on:
    # This is triggered weekly via the 'scheduler.yaml' workflow.
    workflow_dispatch:

jobs:

    get-date:
        runs-on: ubuntu-24.04
        outputs:
            date: ${{ steps.date.outputs.date }}
        steps:
            - name: Get the current date
              id: date
              run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    macos-compilation:
        # The purpose of this is to cache the macOS compilation.
        # MacOS compilation checks are run as part of the CI tests but as the
        # MacOS GitHub action runners are quite costly, it's advantageous to
        # build upon a cache. Putting this in the daily tests means that the
        # cache is refreshed on a daily basis.
        runs-on: macos-26
        needs: get-date

        strategy:
            fail-fast: false
            matrix:
                type: [fast, opt]

        steps:
            - name: Checkout the gem5 repository
              uses: actions/checkout@v4

            - name: Install the gem5 dependencies
              run: |
                  brew update
                  brew install \
                    cmake \
                    ninja \
                    python \
                    pkg-config \
                    protobuf \
                    grpc \
                    boost


            - name: Cache macOS build/ALL
              uses: actions/cache@v4
              with:
                  path: build/ALL
                  key: macos-all-gem5-${{ matrix.type }}-${{ needs.get-date.outputs.date }}
                  restore-keys: |
                      macos-all-gem5-${{ matrix.type }}

            - name: Compile gem5.${{ matrix.type }}
              working-directory: ${{ github.workspace }}
              run: |
                  BUILD_TYPE="GEM5_$(echo '${{ matrix.type }}' | tr '[:lower:]' '[:upper:]')"
                  cmake -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DGEM5_BUILD_VARIANT=ALL -B build/ALL
                  ninja -C build/ALL -j$(sysctl -n hw.ncpu)
              timeout-minutes: 90

    build-all-gem5:
        runs-on: [self-hosted, linux, x64]
        container: ghcr.io/gem5/ubuntu-24.04_all-dependencies:latest
        timeout-minutes: 180
        needs: get-date

        steps:
            - uses: actions/checkout@v4
            - name: Ensure build tools are available
              run: |
                  command -v ninja || { DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y --no-install-recommends ninja-build; }
                  ninja --version

            - name: Cache build/ALL_opt
              uses: actions/cache@v4
              with:
                  path: build/ALL_opt
                  key: testlib-build-all-opt-${{ needs.get-date.outputs.date }}
                  restore-keys: |
                      testlib-build-all-opt

            - name: Build ALL_opt/gem5
              run: |
                  cmake -G Ninja -DCMAKE_BUILD_TYPE=GEM5_OPT -DGEM5_BUILD_VARIANT=ALL -DGEM5_NO_COMPRESS_DEBUG=ON -B build/ALL_opt
                  ninja -C build/ALL_opt -j$(nproc)

  # this builds both unittests.fast and unittests.debug
    unittests-debug:
        strategy:
            matrix:
                type: [debug]
        runs-on: [self-hosted, linux, x64]
        container: ghcr.io/gem5/ubuntu-24.04_all-dependencies:latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
            - name: Ensure build tools are available
              run: |
                  command -v ninja || { DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y --no-install-recommends ninja-build; }
                  ninja --version

            - name: Run ALL/unittests.${{ matrix.type }} UnitTests
              run: |
                  BUILD_TYPE="GEM5_$(echo '${{ matrix.type }}' | tr '[:lower:]' '[:upper:]')"
                  cmake -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DGEM5_BUILD_VARIANT=ALL -B build/ALL
                  ninja -C build/ALL gem5_tests gem5 -j$(nproc)
                  cd build/ALL && ctest --output-on-failure

    get-testlib-long-dirs:
        runs-on: ubuntu-24.04
        container: ghcr.io/gem5/ubuntu-24.04_all-dependencies:latest
        outputs:
            test-dirs-matrix: ${{ steps.dir-matrix.outputs.test-dirs-matrix }}
        steps:
            - uses: actions/checkout@v4
            - name: Get directories for testlib-long
              working-directory: ${{ github.workspace }}/tests
              id: dir-matrix
              run: |
                  unset PREV
                  echo "test-dirs-matrix=$(\
                    ./main.py list gem5 \
                    --suites \
                    --length=long \
                    --exclude-tags gcn_gpu | \
                    grep "$SUITEUID:" | \
                    cut -d: -f2 | \
                    cut -d/ -f 2- | \
                    xargs dirname | \
                    sort -u  | \
                    while read x; do \
                      if [ -z "${PREV}" ] || [ "$x" != "${PREV}/*" ]; then \
                        PREV=$x; \
                        echo $x; \
                      fi; \
                    done  | \
                    jq -ncR '[inputs]'\
                  )" >>$GITHUB_OUTPUT

  # start running all of the long tests
    testlib-long-tests:
        name: long-tests
        runs-on: [self-hosted, linux, x64]
        container: ghcr.io/gem5/ubuntu-24.04_all-dependencies:latest
        timeout-minutes: 1440 # 24 hours for entire matrix to run
        needs:
            - build-all-gem5
            - get-testlib-long-dirs
            - get-date
        strategy:
            fail-fast: false
            matrix:
                test-type: ${{ fromJson(needs.get-testlib-long-dirs.outputs.test-dirs-matrix) }}

        steps:
            - uses: actions/checkout@v4
            - name: Ensure build tools are available
              run: |
                  command -v ninja || { DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y --no-install-recommends ninja-build; }
                  ninja --version
            - name: Restore build/ALL_opt cache
              uses: actions/cache/restore@v4
              with:
                  path: build/ALL_opt
                  key: testlib-build-all-opt-${{ needs.get-date.outputs.date }}
                  restore-keys: |
                      testlib-build-all-opt

            - name: Run long ${{ matrix.test-type }} tests
              id: run-tests
              timeout-minutes: 1410
              working-directory: ${{ github.workspace }}/tests
              run: ./main.py run ${{ matrix.test-type }} -j$(nproc) --length=long -vv -t $(nproc) --exclude-tags gcn_gpu

            - name: Sanitize test-dir for artifact name
              id: sanitize-test-dir
              if: success() || failure()
              run: echo "sanitized-test-dir=$(echo '${{ matrix.test-type }}' | sed 's/\//-/g')" >> $GITHUB_OUTPUT

            - name: Upload results
              if: success() || failure()
              uses: actions/upload-artifact@v4
              env:
                  MY_STEP_VAR: ${{ steps.sanitize-test-dir.outputs.sanitized-test-dir }}_COMMIT.${{github.sha}}_RUN.${{github.run_id}}_ATTEMPT.${{github.run_attempt}}
              with:
                  name: daily-tests-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}-testlib-long-${{ steps.sanitize-test-dir.outputs.sanitized-test-dir
                      }}-status-${{ steps.run-tests.outcome }}-output
                  path: tests/testing-results


    gpu-tests:
        runs-on: [self-hosted, linux, x64]
        container: ghcr.io/gem5/gcn-gpu:latest
        timeout-minutes: 1440 # 24 hours
        needs:
            - get-date

        steps:
            - uses: actions/checkout@v4
            - name: Install newer cmake and ninja
              run: |
                  python3 -m pip --version || { DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y --no-install-recommends python3-pip; }
                  python3 -m pip install cmake ninja
                  cmake --version
                  ninja --version
            - name: Cache build/VEGA_X86_opt
              uses: actions/cache@v4
              with:
                  path: build/VEGA_X86_opt
                  key: testlib-build-vega-opt-${{ needs.get-date.outputs.date }}
                  restore-keys: |
                      testlib-build-vega-opt


            - name: Run Testlib GPU Tests
              id: run-tests
              timeout-minutes: 1410
              working-directory: ${{ github.workspace }}/tests
              run: ./main.py run --length=long -vvv -j $(nproc) --host gcn_gpu

            - name: Upload results
              if: success() || failure()
              uses: actions/upload-artifact@v4
              with:
                  name: ci-tests-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}-gpu-status-${{ steps.run-tests.outcome }}-output
                  path: tests/testing-results

  # This runs the SST-gem5 integration compilation and tests it with
  # ext/sst/sst/example.py.
    sst-test:
        runs-on: [self-hosted, linux, x64]
        container: ghcr.io/gem5/sst-env:latest
        timeout-minutes: 180

        steps:
            - uses: actions/checkout@v4
            - name: Ensure build tools are available
              run: |
                  command -v ninja || { DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y --no-install-recommends ninja-build; }
                  ninja --version
            - name: Build RISCV/libgem5_shared.so with SST
              run: |
                  cmake -G Ninja -DCMAKE_BUILD_TYPE=GEM5_OPT -DGEM5_BUILD_VARIANT=RISCV -DGEM5_WITH_TCMALLOC=OFF -B build/RISCV
                  ninja -C build/RISCV gem5_shared -j$(nproc)
            - name: Makefile ext/sst
              working-directory: ${{ github.workspace }}/ext/sst
              run: mv Makefile.linux Makefile
            - name: Compile ext/sst
              working-directory: ${{ github.workspace }}/ext/sst
              run: make -j $(nproc)
            - name: Run SST test
              working-directory: ${{ github.workspace }}/ext/sst
              run: sst --add-lib-path=./ sst/example.py

  # This runs the gem5 within SystemC ingration and runs a simple hello-world
  # simulation with it.
    systemc-test:
        runs-on: [self-hosted, linux, x64]
        container: ghcr.io/gem5/systemc-env:latest
        timeout-minutes: 180

        steps:
            - uses: actions/checkout@v4
            - name: Ensure build tools are available
              run: |
                  command -v ninja || { DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y --no-install-recommends ninja-build; }
                  ninja --version
            - name: Build ARM/gem5
              run: |
                  cmake -G Ninja -DCMAKE_BUILD_TYPE=GEM5_OPT -DGEM5_BUILD_VARIANT=ARM -B build/ARM
                  ninja -C build/ARM -j$(nproc)
            - name: Build ARM/libgem5_shared.so (without SystemC, with C++ config)
              run: |
                  cmake -G Ninja -DCMAKE_BUILD_TYPE=GEM5_OPT -DGEM5_BUILD_VARIANT=ARM \
                    -DGEM5_WITH_CXX_CONFIG=ON -DGEM5_WITHOUT_PYTHON=ON -DGEM5_WITH_TCMALLOC=OFF \
                    -DGEM5_KCONFIG_OVERRIDE="USE_SYSTEMC=n" \
                    -B build/ARM-shared
                  ninja -C build/ARM-shared gem5_shared -j$(nproc)
            - name: Compile gem5 within SystemC
              working-directory: ${{ github.workspace }}/util/systemc/gem5_within_systemc
              run: make GEM5_BUILD_DIR=../../../build/ARM-shared
            - name: Run gem5 within SystemC test
              # Note: Uses deprecated/example/se.py intentionally because
              # CxxConfigManager requires the traditional config.ini format
              # that the old-style configs produce.
              run: ./build/ARM/gem5 configs/deprecated/example/se.py -c tests/test-progs/hello/bin/arm/linux/hello
            - name: Continue gem5 within SystemC test
              run: LD_LIBRARY_PATH=build/ARM-shared/:/opt/systemc/lib-linux64/ ./util/systemc/gem5_within_systemc/gem5.sc m5out/config.ini

    dramsys-tests:
        runs-on: [self-hosted, linux, x64]
        container: ghcr.io/gem5/ubuntu-24.04_all-dependencies:latest
        timeout-minutes: 360 # 6 hours
        steps:
            - uses: actions/checkout@v4
            - name: Ensure build tools are available
              run: |
                  command -v ninja || { DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y --no-install-recommends ninja-build; }
                  ninja --version
            - name: Checkout DRAMSys
              working-directory: ${{ github.workspace }}/ext/dramsys
              run: git clone https://github.com/tukl-msd/DRAMSys --branch v5.3.1 --depth 1 DRAMSys

              # gem5 is built separately because it depends on the DRAMSys library
            - name: Build gem5
              working-directory: ${{ github.workspace }}
              run: |
                  cmake -G Ninja -DCMAKE_BUILD_TYPE=GEM5_OPT -DGEM5_BUILD_VARIANT=ALL -B build/ALL
                  ninja -C build/ALL -j$(nproc)

            - name: Run DRAMSys Checks
              working-directory: ${{ github.workspace }}
              run: |
                  ./build/ALL/gem5 configs/example/gem5_library/dramsys/arm-hello-dramsys.py
                  ./build/ALL/gem5 configs/example/gem5_library/dramsys/dramsys-traffic.py
                  ./build/ALL/gem5 configs/example/dramsys.py
