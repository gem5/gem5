---
# Long TestLib suites, debug unit tests, and integration tests.
# Coverage callers use this same test plan with GCC instrumentation enabled.

name: Daily Tests

on:
    # The scheduler dispatches ordinary Daily tests.
    workflow_dispatch:
    workflow_call:
        inputs:
            coverage-image:
                description: Immutable container used by shared coverage builds
                type: string
                default: ''
            source-ref:
                description: Tested commit to check out for a coverage campaign
                type: string
                default: ''
            coverage:
                description: Build with gcov and upload coverage reports
                type: boolean
                default: false
        secrets:
            CODECOV_TOKEN:
                required: false

env:
    GCOV_FLAGS: ${{ inputs.coverage && '--gcov' || '' }}

jobs:

    get-date:
        runs-on: ubuntu-24.04
        outputs:
            date: ${{ steps.date.outputs.date }}
        steps:
            - name: Get the current date
              id: date
              run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    macos-compilation:
        # Cache warming is not a coverage test; gcov requires GCC on Linux.
        if: ${{ !inputs.coverage }}
        # The purpose of this is to cache the macOS compilation.
        # MacOS compilation checks are run as part of the CI tests but as the
        # MacOS GitHub action runners are quite costly, it's advantageous to
        # build upon a cache. Putting this in the daily tests means that the
        # cache is refreshed on a daily basis.
        runs-on: macos-26
        needs: get-date

        strategy:
            fail-fast: false
            matrix:
                type: [fast, opt]

        steps:
            - name: Checkout the gem5 repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.source-ref || github.sha }}

            - name: Install the gem5 dependencies
              run: |
                  brew update
                  brew install \
                    scons \
                    python \
                    pkg-config \
                    protobuf \
                    grpc \
                    boost


            - name: Cache macOS build/ALL
              uses: actions/cache@v6
              with:
                  path: build/ALL
                  key: macos-all-gem5-${{ matrix.type }}-${{ needs.get-date.outputs.date }}
                  restore-keys: |
                      macos-all-gem5-${{ matrix.type }}

            - name: Compile gem5.${{ matrix.type }}
              working-directory: ${{ github.workspace }}
              run: |
                  CMD="scons build/ALL/gem5.${{ matrix.type }} -j $(sysctl -n hw.ncpu)"
                  if ! ${CMD}; then
                      echo "Failed to build on top of cached build." 1>&2
                      echo "This may be due to env changes since the cache build." 1>&2
                      echo "Clearing cache and attempting another build..." 1>&2
                      rm -rf build
                      ${CMD}
                  fi
              timeout-minutes: 120

    build-testlib-gem5:
        if: ${{ !inputs.coverage }}
        runs-on: [self-hosted, linux, x64]
        container: ghcr.io/gem5/ubuntu-24.04_all-dependencies:latest
        timeout-minutes: 180
        needs: [get-date, get-testlib-long-dirs]
        strategy:
            fail-fast: false
            max-parallel: 2
            matrix:
                target: ${{ fromJson(needs.get-testlib-long-dirs.outputs.build-matrix) }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.source-ref || github.sha }}

            - name: Cache the incremental build
              uses: actions/cache@v6
              with:
                  path: build/${{ matrix.target }}
                  key: testlib-build-${{ matrix.target }}-${{ needs.get-date.outputs.date }}
                  restore-keys: |
                      testlib-build-${{ matrix.target }}

            - name: Build the TestLib target
              env:
                  BUILD_TARGET: ${{ matrix.target }}
              run: |
                  # Match Gem5Fixture, including objects used only by tests.
                  scons --ignore-style defconfig "build/$BUILD_TARGET" "build_opts/$BUILD_TARGET"
                  scons --ignore-style setconfig "build/$BUILD_TARGET" USE_TEST_OBJECTS=y
                  scons --ignore-style "build/$BUILD_TARGET/gem5.opt" -j "$(nproc)"

            - name: Package the executable
              env:
                  BUILD_TARGET: ${{ matrix.target }}
              run: |
                  printf '%s\0' "build/$BUILD_TARGET/gem5.opt" > "$RUNNER_TEMP/build-files"
                  tar -czf "gem5-$BUILD_TARGET.tar.gz" --null -T "$RUNNER_TEMP/build-files"

            - name: Publish the build executable as artifact
              uses: actions/upload-artifact@v7
              with:
                  # Keep names stable when rerunning only failed consumers.
                  name: daily-gem5-${{ github.run_id }}-${{ matrix.target }}
                  path: gem5-${{ matrix.target }}.tar.gz
                  compression-level: 0
                  if-no-files-found: error
                  retention-days: 7
                  overwrite: true

  # this builds and runs unittests.debug
    unittests-debug:
        strategy:
            matrix:
                type: [debug]
        runs-on: ${{ fromJSON(inputs.coverage && '{"group":"gem5-coverage","labels":"gem5-coverage"}' || '["self-hosted","linux","x64"]') }}
        container: ${{ inputs.coverage-image || 'ghcr.io/gem5/ubuntu-24.04_all-dependencies:latest' }}
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.source-ref || github.sha }}

            - name: Run ALL/unittests.${{ matrix.type }} UnitTests
              id: run-native
              run: scons build/ALL/unittests.${{ matrix.type }} ${GCOV_FLAGS:+--gcov} -j $(nproc)

            - name: Collect aggregate native coverage
              if: ${{ !cancelled() && inputs.coverage }}
              uses: ./.github/actions/collect-native-coverage
              with:
                  group: unittests-${{ matrix.type }}
                  outcomes: '{"build_and_test":"${{ steps.run-native.outcome }}"}'

    get-testlib-long-dirs:
        runs-on: ubuntu-24.04
        container: ${{ inputs.coverage-image || 'ghcr.io/gem5/ubuntu-24.04_all-dependencies:latest' }}
        outputs:
            test-dirs-matrix: ${{ steps.dir-matrix.outputs.test-dirs-matrix }}
            build-matrix: ${{ steps.build-matrix.outputs.build-matrix }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.source-ref || github.sha }}
            - name: Get directories for testlib-long
              working-directory: ${{ github.workspace }}/tests
              id: dir-matrix
              run: |
                  ./main.py list gem5 --suites -q --length=long ${GCOV_FLAGS:+--gcov=per-test --python-coverage} > "$RUNNER_TEMP/test-suites"
                  test_dirs=$(jq -Rsc '
                    split("\n") |
                    map(select(startswith("SuiteUID:")) |
                        split(":")[1] | split("/")[1:-1] | join("/")) |
                    unique |
                    if length == 0 then error("No TestLib suites found") else . end
                  ' "$RUNNER_TEMP/test-suites")
                  echo "test-dirs-matrix=$test_dirs" >> "$GITHUB_OUTPUT"

            - name: Record expected coverage suites
              if: inputs.coverage
              run: |
                  python3 util/coverage/report.py manifest "$RUNNER_TEMP/test-suites" --length=long --revision "$(git rev-parse HEAD)" --python-coverage --output "$RUNNER_TEMP/coverage-plan/expected.json"
            - name: Retain coverage discovery manifest
              if: ${{ always() && inputs.coverage }}
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-plan-long
                  path: ${{ runner.temp }}/coverage-plan
                  retention-days: 30
                  overwrite: true
                  if-no-files-found: error

            - name: Discover required binary configurations
              id: build-matrix
              working-directory: ${{ github.workspace }}/tests
              run: |
                  ./main.py list gem5 --length=long --host x86_64 --build-targets -q ${GCOV_FLAGS:+--gcov=per-test --python-coverage} > "$RUNNER_TEMP/build-targets"
                  # Always refresh the ALL cache for the PR and weekly tests.
                  build_matrix=$(jq -Rsc 'split("\n") | map(select(length > 0) | split("/")[-2]) | . + ["ALL"] | unique' "$RUNNER_TEMP/build-targets")
                  echo "build-matrix=$build_matrix" >> "$GITHUB_OUTPUT"

  # start running all of the long tests
    testlib-long-tests:
        name: long-tests
        if: ${{ !cancelled() && needs.get-testlib-long-dirs.result == 'success' && (inputs.coverage || needs.build-testlib-gem5.result == 'success') }}
        runs-on: ${{ fromJSON(inputs.coverage && '{"group":"gem5-coverage","labels":"gem5-coverage"}' || '["self-hosted","linux","x64"]') }}
        container:
            image: ${{ inputs.coverage-image || 'ghcr.io/gem5/ubuntu-24.04_all-dependencies:latest' }}
            volumes:
                - /gem5-resource-cache:/gem5-resource-cache
        env:
            GEM5_RESOURCE_DIR: /gem5-resource-cache
        timeout-minutes: ${{ inputs.coverage && 1800 || 1440 }}
        needs:
            - build-testlib-gem5
            - get-testlib-long-dirs
            - get-date
        strategy:
            fail-fast: false
            max-parallel: ${{ inputs.coverage && 5 || 256 }}
            matrix:
                test-type: ${{ fromJson(needs.get-testlib-long-dirs.outputs.test-dirs-matrix) }}

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.source-ref || github.sha }}
            - name: Restore verified coverage binaries
              if: inputs.coverage
              uses: ./.github/actions/restore-coverage-build
              with:
                  test-dir: ${{ matrix.test-type }}
                  length: long
                  revision: ${{ inputs.source-ref || github.sha }}
                  image: ${{ inputs.coverage-image }}

            - name: Select the binaries needed by these suites
              if: ${{ !inputs.coverage }}
              id: required-binaries
              working-directory: ${{ github.workspace }}/tests
              env:
                  TEST_DIR: ${{ matrix.test-type }}
              run: |
                  ./main.py list "$TEST_DIR" --length=long --build-targets -q ${GCOV_FLAGS:+--gcov=per-test --python-coverage} > "$RUNNER_TEMP/required-binaries"
                  if [ ! -s "$RUNNER_TEMP/required-binaries" ]; then
                    echo "has-binaries=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  targets=$(jq -Rrsc 'split("\n") | map(select(length > 0) | split("/")[-2]) | unique | join("|")' "$RUNNER_TEMP/required-binaries")
                  echo "has-binaries=true" >> "$GITHUB_OUTPUT"
                  # download-artifact uses minimatch: match exactly this set.
                  echo "artifact-pattern=daily-gem5-${{ inputs.coverage && 'gcov-' || '' }}$GITHUB_RUN_ID-@($targets)" >> "$GITHUB_OUTPUT"

            - name: Download this run's binary artifacts
              if: ${{ !inputs.coverage && steps.required-binaries.outputs.has-binaries == 'true' }}
              uses: actions/download-artifact@v8
              with:
                  pattern: ${{ steps.required-binaries.outputs.artifact-pattern }}
                  path: ${{ runner.temp }}/gem5-binaries
                  merge-multiple: true

            - name: Unpack the binaries
              if: ${{ !inputs.coverage && steps.required-binaries.outputs.has-binaries == 'true' }}
              run: |
                  for archive in "$RUNNER_TEMP"/gem5-binaries/gem5-*.tar.gz; do
                    tar -xzf "$archive"
                  done

            - name: Install the Python coverage tracer
              if: inputs.coverage
              run: |
                  python3 -m pip install --target "$RUNNER_TEMP/coverage-python" coverage==7.10.7
                  echo "PYTHONPATH=$RUNNER_TEMP/coverage-python${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

            - name: Run long ${{ matrix.test-type }} tests
              id: run-tests
              timeout-minutes: ${{ inputs.coverage && 1770 || 1410 }}
              working-directory: ${{ github.workspace }}/tests
              run: |
                  resource_dir="$GEM5_RESOURCE_DIR"
                  # These legacy fixtures do not checksum or lock downloads.
                  case "${{ matrix.test-type }}" in
                    gem5/cpu_tests|gem5/fdp_tests|gem5/m5threads_test_atomic)
                      resource_dir="$RUNNER_TEMP/gem5-testlib-downloads"
                      ;;
                  esac
                  test_threads=$(nproc)
                  if [ -n "$GCOV_FLAGS" ]; then
                    test_threads=1
                  fi
                  ./main.py run ${{ matrix.test-type }} --skip-build -j$(nproc) --length=long -vv -t "$test_threads" --bin-path "$resource_dir" ${GCOV_FLAGS:+--gcov=per-test --python-coverage}

            - name: Sanitize test-dir for artifact name
              id: sanitize-test-dir
              if: always()
              run: echo "sanitized-test-dir=$(echo '${{ matrix.test-type }}' | sed 's/\//-/g')" >> $GITHUB_OUTPUT

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: daily-tests-${{ inputs.coverage && 'gcov-' || '' }}run-${{ github.run_number }}-attempt-${{ github.run_attempt }}-testlib-long-${{
                      steps.sanitize-test-dir.outputs.sanitized-test-dir }}-status-${{ steps.run-tests.outcome }}-output
                  path: |
                      tests/testing-results
                      !tests/testing-results/coverage/**
            - name: Package raw profiles without duplicating shared notes
              if: ${{ always() && inputs.coverage }}
              run: python3 util/coverage/report.py package tests/testing-results --output coverage-data --revision "$(git rev-parse HEAD)"
            - name: Retain per-invocation coverage and test results
              if: ${{ always() && inputs.coverage }}
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-data-long-${{ steps.sanitize-test-dir.outputs.sanitized-test-dir }}
                  path: coverage-data
                  compression-level: 6
                  retention-days: 30
                  overwrite: true
                  if-no-files-found: error

  # This runs the SST-gem5 integration compilation and tests it with
  # ext/sst/sst/example.py.
    sst-test:
        runs-on: ${{ fromJSON(inputs.coverage && '{"group":"gem5-coverage","labels":"gem5-coverage"}' || '["self-hosted","linux","x64"]') }}
        container: ghcr.io/gem5/sst-env:latest
        timeout-minutes: 240
        needs: get-date

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.source-ref || github.sha }}

            - name: Cache the SST build
              uses: actions/cache@v6
              with:
                  path: build/*
                  key: ${{ inputs.coverage && 'gcov-' || '' }}sst-build-${{ needs.get-date.outputs.date }}
                  restore-keys: |
                      ${{ inputs.coverage && 'gcov-' || '' }}sst-build

            - name: Build RISCV/libgem5_opt.so with SST
              id: build-native
              run: |
                  scons defconfig build/RISCV build_opts/RISCV --ignore-style
                  scons build/RISCV/libgem5_opt.so ${GCOV_FLAGS:+--gcov} --without-tcmalloc --duplicate-sources --ignore-style -j $(nproc)
            - name: Makefile ext/sst
              working-directory: ${{ github.workspace }}/ext/sst
              run: mv Makefile.linux Makefile
            - name: Compile ext/sst
              id: build-integration
              working-directory: ${{ github.workspace }}/ext/sst
              run: make -j $(nproc)
            - name: Clear coverage counters before testing
              if: inputs.coverage
              run: find build -type f \( -name '*.gcda' -o -name '*.py.gcno' \) -delete
            - name: Run SST test
              id: run-tests
              working-directory: ${{ github.workspace }}/ext/sst
              run: sst --add-lib-path=./ sst/example.py

            - name: Collect aggregate native coverage
              if: ${{ !cancelled() && inputs.coverage }}
              uses: ./.github/actions/collect-native-coverage
              with:
                  group: sst-test
                  outcomes: '{"build":"${{ steps.build-native.outcome }}","integration_build":"${{ steps.build-integration.outcome }}","run":"${{ steps.run-tests.outcome
                      }}"}'

  # This runs the gem5 within SystemC ingration and runs a simple hello-world
  # simulation with it.
    systemc-test:
        runs-on: ${{ fromJSON(inputs.coverage && '{"group":"gem5-coverage","labels":"gem5-coverage"}' || '["self-hosted","linux","x64"]') }}
        container: ghcr.io/gem5/systemc-env:latest
        timeout-minutes: 180
        # The shared-library build changes the configuration and generated
        # headers. Restoring it can race header regeneration on the next run.
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.source-ref || github.sha }}
            - name: Build ARM/gem5.opt
              id: build-binary
              run: |
                  scons defconfig build/ARM build_opts/ARM --ignore-style
                  scons build/ARM/gem5.opt ${GCOV_FLAGS:+--gcov} --ignore-style --duplicate-sources -j$(nproc)
            - name: disable systemc
              id: configure-library
              run: scons setconfig build/ARM --ignore-style USE_SYSTEMC=n
            - name: Build ARM/libgem5_opt.so
              id: build-library
              run: scons build/ARM/libgem5_opt.so ${GCOV_FLAGS:+--gcov} --with-cxx-config --without-python --without-tcmalloc -j$(nproc) --duplicate-sources
            - name: Compile gem5 withing SystemC
              id: build-integration
              working-directory: ${{ github.workspace }}/util/systemc/gem5_within_systemc
              run: make
            - name: Clear coverage counters before testing
              if: inputs.coverage
              run: find build -type f \( -name '*.gcda' -o -name '*.py.gcno' \) -delete
            - name: Run gem5 within SystemC test
              id: run-tests
              run: ./build/ARM/gem5.opt configs/deprecated/example/se.py -c tests/test-progs/hello/bin/arm/linux/hello
            - name: Continue gem5 within SystemC test
              id: run-continue
              run: LD_LIBRARY_PATH=build/ARM/:/opt/systemc/lib-linux64/ ./util/systemc/gem5_within_systemc/gem5.opt.sc m5out/config.ini

            - name: Collect aggregate native coverage
              if: ${{ !cancelled() && inputs.coverage }}
              uses: ./.github/actions/collect-native-coverage
              with:
                  group: systemc-test
                  outcomes: '{"build_binary":"${{ steps.build-binary.outcome }}","configure_library":"${{ steps.configure-library.outcome }}","build_library":"${{
                      steps.build-library.outcome }}","integration_build":"${{ steps.build-integration.outcome }}","run_initial":"${{ steps.run-tests.outcome
                      }}","run_continue":"${{ steps.run-continue.outcome }}"}'

    dramsys-tests:
        runs-on: ${{ fromJSON(inputs.coverage && '{"group":"gem5-coverage","labels":"gem5-coverage"}' || '["self-hosted","linux","x64"]') }}
        container:
            image: ${{ inputs.coverage-image || 'ghcr.io/gem5/ubuntu-24.04_all-dependencies:latest' }}
            volumes:
                - /gem5-resource-cache:/gem5-resource-cache
        env:
            GEM5_RESOURCE_DIR: /gem5-resource-cache
        timeout-minutes: 360 # 6 hours
        needs: get-date
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.source-ref || github.sha }}
            - name: Checkout DRAMSys
              working-directory: ${{ github.workspace }}/ext/dramsys
              run: git clone https://github.com/tukl-msd/DRAMSys --branch v5.6.0 --depth 1 DRAMSys

            - name: Cache the build
              uses: actions/cache@v6
              with:
                  path: build/*
                  key: ${{ inputs.coverage && 'gcov-' || '' }}dramsys-build-${{ needs.get-date.outputs.date }}
                  restore-keys: |
                      ${{ inputs.coverage && 'gcov-' || '' }}dramsys-build

              # gem5 is built separately because it depends on the DRAMSys library
            - name: Build gem5
              id: build-native
              working-directory: ${{ github.workspace }}
              run: |
                  scons defconfig build/ALL build_opts/ALL
                  scons build/ALL/gem5.opt ${GCOV_FLAGS:+--gcov} -j $(nproc)

            - name: Clear coverage counters before testing
              if: inputs.coverage
              run: find build -type f \( -name '*.gcda' -o -name '*.py.gcno' \) -delete
            - name: Run DRAMSys Checks
              id: run-tests
              working-directory: ${{ github.workspace }}
              run: |
                  ./build/ALL/gem5.opt configs/example/gem5_library/dramsys/arm-hello-dramsys.py
                  ./build/ALL/gem5.opt configs/example/gem5_library/dramsys/dramsys-traffic.py
                  ./build/ALL/gem5.opt configs/example/dramsys.py
            - name: Collect aggregate native coverage
              if: ${{ !cancelled() && inputs.coverage }}
              uses: ./.github/actions/collect-native-coverage
              with:
                  group: dramsys-tests
                  outcomes: '{"build":"${{ steps.build-native.outcome }}","run":"${{ steps.run-tests.outcome }}"}'
