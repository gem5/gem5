---
name: Build and test devcontainers

on:
    push:
        branches: [develop]
        paths:
            - util/dockerfiles/**
            - .devcontainer/**
            - .vscode/**
            - requirements.txt
            - .pre-commit-config.yaml
            - .github/workflows/devcontainer-build.yaml
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: devcontainer-publish
    cancel-in-progress: false

jobs:
    build:
        if: github.repository == 'gem5/gem5' && github.ref == 'refs/heads/develop'
        runs-on: [self-hosted, linux, x64]
        timeout-minutes: 360
        permissions:
            contents: read
            packages: write
        outputs:
            tag: ${{ steps.candidate.outputs.tag }}
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-qemu-action@v4
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Select a unique candidate tag
              id: candidate
              run: |
                  tag="$(date -u +%Y%m%d)-${GITHUB_SHA:0:12}"
                  tag="${tag}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
            - name: Build candidate images
              uses: docker/bake-action@v7
              env:
                  TAG: ${{ steps.candidate.outputs.tag }}
                  PACKAGE_REFRESH: ${{ steps.candidate.outputs.tag }}
              with:
                  source: '{{defaultContext}}:util/dockerfiles'
                  targets: devcontainers
                  provenance: true
                  push: true
                  set: |
                      *.labels.org.opencontainers.image.revision=${{ github.sha }}
                      ubuntu-24-04_all-dependencies.no-cache=true

    smoke:
        needs: build
        permissions:
            contents: read
            packages: read
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm]
                variant: [devcontainer, devcontainer-demo, devcontainer-workloads]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        env:
            VARIANT: ${{ matrix.variant }}
            IMAGE_TAG: ${{ needs.build.outputs.tag }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Install the Dev Container CLI
              run: npm install --global @devcontainers/cli@0.89.0
            - name: Select the candidate in the real configuration
              run: |
                  python3 - <<'PYCODE'
                  import json
                  import os
                  from pathlib import Path

                  variant = os.environ["VARIANT"]
                  configurations = {
                      "devcontainer": ".devcontainer/devcontainer.json",
                      "devcontainer-demo": ".devcontainer/demo/devcontainer.json",
                      "devcontainer-workloads": ".devcontainer/workloads/devcontainer.json",
                  }
                  path = Path(configurations[variant])
                  config = json.loads(path.read_text())
                  tag = os.environ["IMAGE_TAG"]
                  config["image"] = f"ghcr.io/gem5/{variant}:{tag}"
                  path.write_text(json.dumps(config, indent=4) + "\n")
                  with open(os.environ["GITHUB_ENV"], "a") as output:
                      output.write(f"DEVCONTAINER_CONFIG={path}\n")
                  PYCODE
            - name: Create the complete development container
              run: |
                  devcontainer up --workspace-folder . \
                      --config "$DEVCONTAINER_CONFIG"
            - name: Check tools, hooks, compiler commands, and a C++ test
              run: |
                  devcontainer exec --workspace-folder . \
                      --config "$DEVCONTAINER_CONFIG" \
                      .devcontainer/smoke-test.sh "$VARIANT"

    promote:
        needs: [build, smoke]
        runs-on: ubuntu-24.04
        permissions:
            packages: write
        env:
            IMAGE_TAG: ${{ needs.build.outputs.tag }}
        steps:
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Promote tested images
              run: |
                  for variant in devcontainer devcontainer-demo devcontainer-workloads; do
                      image="ghcr.io/gem5/$variant"
                      docker buildx imagetools create \
                          --tag "$image:latest" "$image:$IMAGE_TAG"
                  done
