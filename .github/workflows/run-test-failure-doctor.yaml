---

name: Run Test Failure Doctor GitHub agentic workflow on test failure

on:
    workflow_dispatch:
    workflow_run:
        workflows: [Daily Tests, Weekly Tests, Compiler Tests, CI Tests]
        types: [completed]


env:
  # This is the token used to authenticate with GitHub.
  # It is required to run the `gh` CLI.
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    run_workflows:
        permissions:
            actions: write
            contents: read
        runs-on: ubuntu-24.04
        steps:
            # This step is necessary to allow the `gh` CLI to be used in the
            # following steps. The `gh` CLI is used to trigger the workflows.
            # and needs to be used inside a the same repository where the
            # workflows are defined.
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Install gh-aw extension
              run: gh extension install github/gh-aw

            - name: Test Failure Doctor
              # Don't run the Test Failure Doctor if the workflow that failed
              # was on its second run (or greater). This helps to avoid
              # continuously rerunning and re-analyzing failed workflows.
              if: |
                  (github.event.workflow_run.conclusion == 'failure' ||
                  github.event.workflow_run.conclusion == 'timed_out') && !(github.event.workflow_run.run_attempt > 1)
              run: |
                  gh aw run test-failure-doctor --ref develop --raw-field failed_workflow_id=${{ github.event.workflow_run.id }}
                  echo ${{ github.event.workflow_run.id }}
                  echo "Test failure doctor scheduled to run on develop branch"
