---
# Very-long TestLib suites, shared by ordinary and coverage runs.

name: Weekly Tests

on:
    # This is triggered weekly via the 'scheduler.yaml' workflow.
    workflow_dispatch:
    workflow_call:
        inputs:
            source-ref:
                description: Tested commit to check out for a coverage campaign
                type: string
                default: ''
            coverage:
                description: Build with gcov and upload coverage reports
                type: boolean
                default: false
        secrets:
            CODECOV_TOKEN:
                required: false

env:
    GCOV_FLAGS: ${{ inputs.coverage && '--gcov' || '' }}

jobs:

    get-testlib-very-long-dirs:
        runs-on: ubuntu-24.04
        container: ghcr.io/gem5/ubuntu-24.04_all-dependencies:latest
        outputs:
            test-dirs-matrix: ${{ steps.dir-matrix.outputs.test-dirs-matrix }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.source-ref || github.sha }}
            - name: Get directories for testlib-very-long
              working-directory: ${{ github.workspace }}/tests
              id: dir-matrix
              run: |
                  ./main.py list gem5 --suites -q --length=very-long ${GCOV_FLAGS:+--gcov=per-test} > "$RUNNER_TEMP/test-suites"
                  test_dirs=$(jq -Rsc '
                    split("\n") |
                    map(select(startswith("SuiteUID:")) |
                        split(":")[1] | split("/")[1:-1] | join("/")) |
                    unique |
                    if length == 0 then error("No TestLib suites found") else . end
                  ' "$RUNNER_TEMP/test-suites")
                  echo "test-dirs-matrix=$test_dirs" >> "$GITHUB_OUTPUT"

            - name: Record expected coverage suites
              if: inputs.coverage
              run: |
                  python3 util/coverage/report.py manifest "$RUNNER_TEMP/test-suites" --length=very-long --revision "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/coverage-plan/expected.json"
            - name: Retain coverage discovery manifest
              if: ${{ always() && inputs.coverage }}
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-plan-very-long
                  path: ${{ runner.temp }}/coverage-plan
                  retention-days: 30
                  overwrite: true
                  if-no-files-found: error

    # start running the very-long tests
    testlib-very-long-tests:
        name: very-long-tests
        strategy:
            fail-fast: false
            max-parallel: 5
            matrix:
                test-type: ${{ fromJson(needs.get-testlib-very-long-dirs.outputs.test-dirs-matrix) }}
        runs-on: [self-hosted, linux, x64]
        container:
            image: ghcr.io/gem5/ubuntu-24.04_all-dependencies:latest
            volumes:
                - /gem5-resource-cache:/gem5-resource-cache
        env:
            GEM5_RESOURCE_DIR: /gem5-resource-cache
        timeout-minutes: 4320 # 3 days
        needs: [get-testlib-very-long-dirs]
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.source-ref || github.sha }}

            - name: Run very-long ${{ matrix.test-type }} tests
              id: run-tests
              timeout-minutes: 4290
              working-directory: ${{ github.workspace }}/tests
              # The o3-cpu_8-cores_classic_DualChannelDDR4_2400_init test in the
              # very-long x86_boot_tests fails with a segmentation fault when
              # run with the --gcov=per-test flag, so run x86_boot_tests
              # very-long without that flag.
              run: |
                  extra_gcov_args="${GCOV_FLAGS:+--gcov=per-test}"
                  resource_dir="$GEM5_RESOURCE_DIR"
                  if [ -n "$GCOV_FLAGS" ] && [ "${{ matrix.test-type }}" = "gem5/x86_boot_tests" ]; then
                    extra_gcov_args=""
                    echo "::warning::x86_boot_tests runs without coverage due to a known instrumentation crash."
                    echo "Coverage excludes very-long x86_boot_tests (known gcov crash)." >> "$GITHUB_STEP_SUMMARY"
                  fi
                  # These legacy fixtures do not checksum or lock downloads.
                  case "${{ matrix.test-type }}" in
                    gem5/cpu_tests|gem5/fdp_tests|gem5/m5threads_test_atomic)
                      resource_dir="$RUNNER_TEMP/gem5-testlib-downloads"
                      ;;
                  esac
                  ./main.py run ${{ matrix.test-type }} --length=very-long ${extra_gcov_args} -j"$(nproc)" -vv --bin-path "$resource_dir"

            - name: Sanitize test-dir for artifact name
              id: sanitize-test-dir
              if: always()
              run: echo "sanitized-test-dir=$(echo '${{ matrix.test-type }}' | sed 's/\//-/g')" >> $GITHUB_OUTPUT

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ inputs.coverage && 'gcov-' || '' }}weekly-tests-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}-testlib-very-long-${{
                      steps.sanitize-test-dir.outputs.sanitized-test-dir }}-status-${{ steps.run-tests.outcome }}-output
                  path: |
                      tests/testing-results
                      !tests/testing-results/coverage/**

            - name: Package raw profiles without duplicating shared notes
              if: ${{ always() && inputs.coverage }}
              run: python3 util/coverage/report.py package tests/testing-results --output coverage-data --revision "$(git rev-parse HEAD)"
            - name: Retain per-invocation coverage and test results
              if: ${{ always() && inputs.coverage }}
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-data-very-long-${{ steps.sanitize-test-dir.outputs.sanitized-test-dir }}
                  path: coverage-data
                  compression-level: 6
                  retention-days: 30
                  overwrite: true
                  if-no-files-found: error
