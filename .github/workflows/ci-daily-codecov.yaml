---
# Run the same quick and Daily test plans with GCC coverage enabled.
name: CI and Daily Tests for Codecov

on:
    # This workflow is triggered alongside the weekly tests by scheduler.yaml.
    workflow_dispatch:

jobs:
    quick:
        uses: ./.github/workflows/quick-tests.yaml
        with:
            coverage: true
        secrets:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    daily:
        # Keep the two coverage matrices within the existing five-job limit.
        # A failed quick test must not prevent collection from Daily tests.
        needs: quick
        if: ${{ !cancelled() }}
        uses: ./.github/workflows/daily-tests.yaml
        with:
            coverage: true
        secrets:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
