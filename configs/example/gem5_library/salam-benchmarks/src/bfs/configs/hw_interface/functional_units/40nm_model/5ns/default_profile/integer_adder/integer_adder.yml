---
functional_unit:
    parameters:
        alias: integer_adder
        stages: 1
        cycles: 1
        enum_value: 1
        datatypes:
            integer:
                size: any
                sign: any
                APMode: true
            floating_point:
                size: none
                sign: none
                APMode: false
            pointer:
                size: none
                sign: none
                APMode: false
        instructions: # LLVM OpCode: Runtime Cycles
            - add
            - sub
        limit: 0 # Max Concurrent Functional Unit Scheduling (0 = Max IR Instances)
    power_model:
        units:
            power: mW
            energy: pJ
            time: ns
            area: um^2
        latency: 5
        internal_power: 9.743773e-03
        switch_power: 7.400587e-03
        dynamic_power: 1.800732e-03
        dynamic_energy: 9.003937e-03
        leakage_power: 7.395312e-05
        area: 5.981433e+00
        path_delay: 1.75
