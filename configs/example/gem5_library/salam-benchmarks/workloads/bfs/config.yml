---
acc_cluster:
    - Name: bfs_clstr
    - DMA:
          - Name: dma
            MaxReqSize: 128
            BufferSize: 256
            PIOMaster: LocalBus
            Type: NonCoherent
            InterruptNum: 95
    - Accelerator:
          - Name: Top
            IrPath: hw/top.ll
            Profile: top
            PIOSize: 37
            InterruptNum: 68
            PIOMaster: LocalBus
            LocalSlaves: LocalBus
            Debug: false
    - Accelerator:
          - Name: bfs
            IrPath: hw/bfs.ll
            Profile: bfs
            Debug: false
            PIOSize: 5
            PIOMaster: LocalBus
          - Var:
                - Name: NODES
                  Type: RegisterBank
                  Size: 2048
          - Var:
                - Name: EDGES
                  Type: RegisterBank
                  Size: 16384
          - Var:
                - Name: LEVELS
                  Type: RegisterBank
                  Size: 256
          - Var:
                - Name: LEVELCOUNTS
                  Type: RegisterBank
                  Size: 40
hw_config:
    top:
    bfs:
