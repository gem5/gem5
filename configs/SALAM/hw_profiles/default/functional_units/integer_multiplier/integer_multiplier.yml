---
functional_unit:
    parameters:
        alias: integer_multiplier
        stages: 1
        cycles: 1
        enum_value: 2
        datatypes:
            integer:
                size: any
                sign: any
                APMode: true
            floating_point:
                size: none
                sign: none
                APMode: false
            pointer:
                size: none
                sign: none
                APMode: false
        instructions: # LLVM instruction names
            - mul
            - udiv
            - sdiv
        limit: 0 # Max Concurrent Functional Unit Scheduling (0 = Max IR Instances)
