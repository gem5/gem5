---
functional_unit:
    parameters:
        alias: float_adder
        stages: 3
        cycles: 5
        enum_value: 5
        datatypes:
            integer:
                size: none
                sign: none
                APMode: false
            floating_point:
                size: single
                sign: any
                APMode: true
            pointer:
                size: none
                sign: none
                APMode: false
        instructions: [] # fadd is owned by double_adder
        limit: 0 # Max Concurrent Functional Unit Scheduling (0 = Max IR Instances)
