---
functional_unit:
    parameters:
        alias: bitwise_operations
        stages: 1
        cycles: 1
        enum_value: 4
        datatypes:
            integer:
                size: any
                sign: any
                APMode: true
            floating_point:
                size: none
                sign: none
                APMode: false
            pointer:
                size: none
                sign: none
                APMode: false
        instructions: # LLVM instruction names
            - and_inst
            - or_inst
            - xor_inst
        limit: 0 # Max Concurrent Functional Unit Scheduling (0 = Max IR Instances)
